<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#080F1E"/>
  
  <!-- Fiber signal waves emanating from bottom-left -->
  <!-- Wave 1 - smallest/innermost -->
  <path d="M 6 26 Q 10 22 14 18" 
        stroke="#00CFE8" stroke-width="2.2" fill="none" 
        stroke-linecap="round" opacity="1"/>
  
  <!-- Wave 2 - medium -->
  <path d="M 6 26 Q 12 18 20 12" 
        stroke="#00CFE8" stroke-width="2.2" fill="none" 
        stroke-linecap="round" opacity="0.75"/>
  
  <!-- Wave 3 - largest/outermost -->
  <path d="M 6 26 Q 14 14 26 6" 
        stroke="#00CFE8" stroke-width="2.2" fill="none" 
        stroke-linecap="round" opacity="0.4"/>

  <!-- Dot at origin -->
  <circle cx="6" cy="26" r="2.5" fill="#00CFE8"/>
  
  <!-- Dot at signal tip -->
  <circle cx="14" cy="18" r="1.8" fill="#00CFE8" opacity="0.9"/>
</svg>
